# members of the board of trustees

- name: "Margaret Esther Cruz"
  title: "President, Co-Founder"
  image: "profile.png"
  bio: > 
    Margaret is an educator, data scientist, and co-founder of the M&M Cruz BEACON Foundation, Inc., where she provides strategic leadership and works closely with the board to shape its long-term direction. Driven by a commitment to excellence and a recognition of the privileges and opportunities that shaped her journey, she believes that every child deserves those same advantages, regardless of background. 
To turn that vision into lasting impact, she ensures that the Foundation's resources are channeled into sustainable pathways for underserved learners. Today, that takes the form of scholarship programs and community outreach initiatives that meet students where they are. Looking ahead, she aims to build on this work by establishing a school that offers accessible, high-quality education to create opportunities for generations to come.
.

- name: "Madelyn Esther Cruz"
  title: "Vice President, Co-Founder"
  image: "madelyn.png"
  bio: > 
    Madelyn used to volunteer at local hospitals during her spare time as a PhD candidate. Having been a scholar since seventh grade, she recognizes the opportunities and resources made available to her through education and the support of others. Because of this, she is committed to creating similar opportunities for students from underserved communities, helping them access the resources, mentorship, and support they need to pursue their academic and professional goals.

- name: "Alpheus Dexter Ayala"
  title: "Secretary"
  image: "profile.png"
  bio: > 
    Dexter: I became a huge science nerd because my dad used to always show us cool stuff like those seeds that explode when exposed to water or point out the Big Dipper in the night sky. Sometimes he’d even bring me along on worktrips to nearby provinces, giving seminars on agriculture stuff like mushroom farming and high-protein livestock feed (na pina-try sakin for some reason). I believe that if we foster this innate curiosity and sense of wonder, every child is capable of carrying a desire to learn—something that can only ripple positively into the other aspects of their lives.I think.
Through this foundation, we hope to provide kids that same spark my dad was able to ignite within me during my formative years.

