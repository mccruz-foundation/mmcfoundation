# members of the board of trustees

- name: "Margaret Esther Cruz"
  title: "President, Co-Founder"
  image: "profile.png"
  bio: > 
    Margaret is an educator and a data scientist. Driven by a commitment to excellence 
    and a recognition of the privileges and opportunities that shaped her journey, 
    she believes that every child deserves those same advantages, regardless of background. 

- name: "Madelyn Esther Cruz"
  title: "Vice President, Co-Founder"
  image: "madelyn.jpg"
  bio: > 
    Madelyn used to volunteer at local hospitals during her spare time as 
    a PhD candidate. She is committed to creating opportunities for students from underserved communities, 
    helping them access the resources, mentorship, and support they need to pursue their academic and professional goals.

